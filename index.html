<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle de projection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b1f;--panel:#171331;--ink:#f4f0ff;--mute:#a79fc9;--accent:#ffb347;--line:#2c2652;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 35% at 30% 30%,#5b2bd6aa,transparent 70%),radial-gradient(35% 30% at 75% 65%,#ff7a3d88,transparent 70%);filter:blur(60px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}html{scroll-behavior:auto}}
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.brand{font-weight:700;color:var(--mute)}
h1{font-size:clamp(1.8rem,5vw,3.6rem);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-bottom:18px}
#stage{position:relative;aspect-ratio:16/9;width:100%;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 30px 90px #000a,0 0 0 1px var(--line)}
#stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
#stage iframe,#stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:1.1rem;text-align:center;padding:20px}
button{font:inherit;cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-2px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cta{background:var(--accent);color:#1a1030;border:0;font-weight:700;border-radius:999px;padding:12px 20px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 30px}
h2{font-size:1.3rem;margin-bottom:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.card.empty{opacity:.7;border-style:dashed}
.n{color:var(--mute);font-size:.85rem}
.big{flex:1;display:grid;place-items:center;font-size:4.5rem;font-weight:800;color:var(--line);letter-spacing:-.04em}
.ttl{flex:1;font-weight:700;font-size:1.1rem;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;word-break:break-word}
.row{display:flex;gap:8px;align-items:center}
.row .cta{flex:1}
.row .ghost{padding:10px 14px}
.cta[disabled]{background:var(--line);color:var(--mute);cursor:not-allowed}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(560px,92vw)}
dialog::backdrop{background:#000a}
label{display:block;margin:12px 0 6px;color:var(--mute);font-size:.95rem}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:220px;font-size:.9rem}
.hint{margin-top:10px;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
<header><div class="brand">Salle de projection</div></header>

<h1 id="now">Choisis une vidéo</h1>
<div id="stage"><div id="idle">Clique sur « Lancer la vidéo » sur une carte ci-dessous.</div></div>
<div class="bar">
<button class="cta" id="fs">Lancer la vidéo</button>
</div>

<h2>Tes 100 vidéos</h2>
<div id="grid"></div>
</main>

<dialog id="dlgOne">
<h2 id="oneH">Modifier</h2>
<label for="oT">Titre</label><input id="oT">
<label for="oU">Lien (YouTube, Vimeo ou .mp4) — vide = R</label><input id="oU" placeholder="https://...">
<div class="row" style="margin-top:18px"><button class="cta" id="oSave">Enregistrer</button><button class="ghost" id="oClear">Vider (R)</button><button class="ghost" id="oClose">Fermer</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
